# Jeff Mentch – personal site
# Restart `bundle exec jekyll serve` after editing this file.

# Site
title: Jeff Mentch
email: jsmentch@mit.edu
description: >-
  Applied scientist building models, datasets, and evaluation workflows for complex real-world signals: speech, audio, movies, gaze, behavior, and brain data.

##### for local testing ######  
# baseurl: ""
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jeffmentch.com" # canonical host (matches CNAME)

twitter_username: jshoonm
github_username:  jsmentch
social_link: instagram
social_username: francois_xr

theme_color: black

# Single source for “Resume” links (nav, home, redirects)
resume_pdf: "/assets/jmentch_resume.pdf"

collections:
  projects:
    output: true
    permalink: /projects/:name/

# Build settings
markdown: kramdown
#theme: minima
theme: jekyll-swiss
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Link previews (jekyll-seo-tag)
twitter:
  username: jshoonm
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/share.png

# Radio: Jeff XR on Spotify (tracks live in _data/radio.yml)
spotify_artist_url: "https://open.spotify.com/artist/690EwgYpY3YkC3iAGs63QX"

exclude:
  - TODO.md
  - .claude
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  
