{% assign radio_tracks = site.data.radio.tracks %}
{% if radio_tracks and radio_tracks.size > 0 %}
<div class="radio" data-radio data-no-excite>
  <button class="radio-hint" type="button" data-radio-hint data-radio-open hidden>
    I make music too. <span>Tune in</span>
  </button>

  <button class="radio-dock" type="button" data-radio-dock data-radio-open aria-haspopup="dialog" aria-controls="radio-set" aria-label="Open the radio: music by Jeff XR">
    <svg class="radio-dock-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <path class="radio-dock-antenna" d="M14 14 27 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="6" y="13.5" width="28" height="19" rx="4.5" fill="currentColor"/>
      <circle class="radio-dock-cut" cx="15" cy="23" r="5.2"/>
      <circle cx="15" cy="23" r="1.6" fill="currentColor"/>
      <rect class="radio-dock-cut" x="24" y="18.5" width="6.5" height="2" rx="1"/>
      <circle class="radio-dock-cut radio-dock-lamp" cx="27.2" cy="26.4" r="1.9"/>
    </svg>
    <span class="radio-dock-bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <div class="radio-backdrop" data-radio-backdrop></div>

  <section class="radio-set" id="radio-set" data-radio-set role="dialog" aria-modal="true" aria-label="Radio: music by Jeff XR" tabindex="-1">
    <button class="radio-close" type="button" data-radio-close aria-label="Close the radio. Music keeps playing.">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>

    <div class="radio-top">
      <div class="radio-grille" aria-hidden="true"></div>
      <div class="radio-readout">
        <p class="radio-onair"><span class="radio-lamp" aria-hidden="true"></span><span data-radio-state>Off air</span></p>
        <p class="radio-freq"><span data-radio-freq>88.1</span><small>FM</small></p>
        <p class="radio-brand">Jeff XR</p>
      </div>
    </div>

    <div class="radio-tuner">
      <div class="radio-scale" data-radio-scale aria-hidden="true"></div>
      <input class="radio-range" type="range" min="0" max="{{ radio_tracks.size | minus: 1 }}" step="0.001" value="0" data-radio-range aria-label="Tuner">
    </div>

    <p class="radio-track" aria-live="polite">
      <strong data-radio-title>{{ radio_tracks[0].title }}</strong>
      <span data-radio-artists>{{ radio_tracks[0].artists }}</span>
    </p>

    <div class="radio-player">
      <div data-radio-embed></div>
      <p class="radio-status" data-radio-status>Warming up&hellip;</p>
    </div>

    <div class="radio-foot">
      <button class="radio-key" type="button" data-radio-prev aria-label="Previous station">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10.5 3 5 8l5.5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="radio-key" type="button" data-radio-next aria-label="Next station">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 3 11 8l-5.5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="radio-count" data-radio-count>1 of {{ radio_tracks.size }}</span>
      <a class="radio-out" href="{{ site.spotify_artist_url }}" target="_blank" rel="noopener noreferrer">More on Spotify</a>
    </div>
  </section>

  <script type="application/json" data-radio-tracks>{{ radio_tracks | jsonify }}</script>
</div>
<script src="{{ '/assets/js/radio.js' | relative_url }}" defer></script>
{% endif %}
